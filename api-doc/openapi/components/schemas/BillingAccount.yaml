type: object
description: An organization's billing (plan, billing status, transfer policy).
properties:
  organization:
    type: string
  plan:
    type: string
  status:
    type: string
    enum: [paying, trial, exempt, comped]
  trial_ends_at:
    type: string
    format: date-time
    nullable: true
  comped_until:
    type: string
    format: date-time
    nullable: true
    description: The last day (UTC) a comped organization is not charged
  reason:
    type: string
  exempt_limits:
    type: string
    enum: [plan, none]
  spending_limit_cents:
    type: integer
    nullable: true
  has_payment_method:
    type: boolean
  cap_lifted_until:
    type: string
    format: date-time
    nullable: true
  extra_transfer_bytes:
    type: integer
  extra_transfer_period:
    type: string
    format: date-time
    nullable: true
  started_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  updated_by:
    type: string
  transfer_state:
    type: string
    enum: [normal, soft, over, capped]
  transfer_state_at:
    type: string
    format: date-time
    nullable: true
  fail_open_at:
    type: string
    format: date-time
    nullable: true
  plan_unassigned:
    type: boolean
    description: No plan chosen yet (billing just turned on), so metered on the free plan without limits
  previous_status:
    type: string
    description: Operators only
  status_since:
    type: string
    format: date-time
    description: Operators only
  previous_plan:
    type: string
    description: Operators only
  plan_since:
    type: string
    format: date-time
    description: Operators only
  policy:
    $ref: BillingPolicy.yaml
  soft_cap_reached:
    type: boolean
    description: The soft cap (80% of the allowance by default) or more is reached this month
  plan_details:
    $ref: BillingPlan.yaml
  current_period:
    type: object
    description: >-
      The devices of the current billing period so far, computed as the period close does (organization view
      only): the average of the daily device counts over the days billed so far, rounded up, and the highest
      daily count.
    properties:
      start:
        type: string
        format: date-time
      billable_devices:
        type: integer
      peak_devices:
        type: integer
      device_days:
        type: integer
