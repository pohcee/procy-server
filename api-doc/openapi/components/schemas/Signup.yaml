type: object
properties:
  id: {type: string}
  email: {type: string}
  domain: {type: string}
  remote_ip: {type: string}
  organization_name: {type: string}
  status: {type: string, enum: [pending, existing, verify_email, verified, awaiting_approval, creating, completed, denied, expired]}
  created_at: {type: string, format: date-time}
  expires_at: {type: string, format: date-time}
  verified_at: {type: string, format: date-time, nullable: true}
  decided_at: {type: string, format: date-time, nullable: true}
  decided_by: {type: string}
  reason: {type: string}
  organization_id: {type: string, nullable: true}
  method: {type: string, enum: [email, google], description: How the email was proven (the emailed link or a Google sign-in)}
  mx_found: {type: boolean, nullable: true, description: The email domain had a mail server at the request; null when not looked up}
  free_mail: {type: boolean, description: The domain is a large free mail provider (the domain counts are 0 then)}
  domain_customers: {type: integer, description: Other completed signups of the same domain (list only)}
  email_denied_before: {type: integer, description: Other denied signups of the same email (list only)}
  domain_denied_before: {type: integer, description: Other denied signups of the same domain (list only)}
