get:
  tags:
    - Library
  summary: Read one version of a library entry, including its content
  operationId: LibraryEntryVersionGet
  parameters:
    - {name: entry_id, in: path, required: true, schema: {type: string}}
    - {name: version, in: path, required: true, schema: {type: integer}}
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/LibraryEntryVersion.yaml
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
