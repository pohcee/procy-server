get:
  tags:
    - Operator
    - Usage
  summary: Return every organization's usage totals. Platform operators only
  description: >-
    Every organization (those without usage too) with its totals over a calendar month (UTC) or a range, heaviest
    first. Usage metering only.
  operationId: OperatorUsageGet
  parameters:
    - name: month
      in: query
      description: The month, YYYY-MM. Default the current month. Not with from and to
      schema:
        type: string
        example: 2026-11
    - name: from
      in: query
      description: Start of the range instead of a month, an RFC 3339 time or a date (whole UTC days)
      schema:
        type: string
    - name: to
      in: query
      description: End of the range (excluded); default now
      schema:
        type: string
    - name: organization
      in: query
      description: List only this organization
      schema:
        type: string
    - name: metric
      in: query
      description: The total to order by, highest first
      schema:
        type: string
        default: transfer_bytes
        enum:
          - transfer_bytes
          - tunnel_bytes_to_user
          - tunnel_bytes_to_device
          - upload_bytes_to_devices
          - api_bytes_out
          - jobs_run
          - device_days
          - devices_billable
          - devices_peak
          - device_hours
          - monitoring_rows
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  sort:
                    type: string
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        totals:
                          $ref: ../components/schemas/UsageTotals.yaml
    '400':
      description: Invalid month, range or metric
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: >-
        No operator API or no usage metering on this server, the request is not from the system organization, or
        the organization asked for does not exist
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
