get:
  tags:
    - Billing
  summary: List the organization's invoices
  description: The newest invoices of the payment provider (drafts excluded). Administrators only.
  operationId: BillingInvoicesGet
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/BillingInvoice.yaml
    '502':
      description: The payment provider could not be reached
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No payment provider on this server (standalone, or [billing] provider "none")
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
