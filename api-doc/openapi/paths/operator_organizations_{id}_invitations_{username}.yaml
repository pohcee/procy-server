delete:
  tags:
    - Operator
  summary: Revoke a pending invitation. Platform operators only
  description: Written to the audit log of `_system` (operator.organization.invitation, delete).
  operationId: OperatorInvitationDelete
  parameters:
    - name: id
      in: path
      description: Organization ID
      required: true
      schema:
        type: string
    - name: username
      in: path
      description: The invited login
      required: true
      schema:
        type: string
  responses:
    '204':
      description: Revoked
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No operator API on this server (standalone), the request is not from the system organization, or the organization does not exist
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
