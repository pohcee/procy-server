get:
  tags:
    - Billing
  summary: Return the plan, billing status and transfer allowance of the requesting user's organization. Administrators only
  description: Available on Postgres servers with `[billing] enabled` (capability `billing`).
  operationId: BillingGet
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/BillingAccount.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not a member of the Administrators group
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: Billing is off on this server
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
