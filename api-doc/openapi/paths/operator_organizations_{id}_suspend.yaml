post:
  tags:
    - Operator
  summary: Suspend an organization. Platform operators only
  description: >-
    Suspend an organization: its users can't log in, and their sessions and API tokens stop working at once. Written to the audit log of `_system`.
  operationId: OperatorOrganizationSuspend
  parameters:
    - name: id
      in: path
      description: Organization ID
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/Organization.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No operator API on this server (standalone), the request is not from the system organization, or the organization does not exist
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
