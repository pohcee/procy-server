post:
  tags:
    - Signup
  summary: Verify a signup and create the organization
  description: >-
    Public. Takes the token of the verification link (single use; refused once used or expired). Creates the organization (generated id: a slug of the name and a random suffix) with the user as its first administrator, on the trial plan with the trial limits until a payment method is on file. With `[signup] require_approval` the signup waits for an operator instead (202). `checkout_required` tells the UI to send the user to the payment checkout first (never for a trial).
  operationId: SignupVerifyPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - token
          properties:
            token:
              type: string
              description: The token from the link
  responses:
    '201':
      description: The organization was created
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/SignupResult.yaml
    '202':
      description: Verified; waiting for the approval of an operator
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/SignupResult.yaml
    '400':
      description: The link is unknown, used or expired
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No signup on this server (standalone, or `[signup]` not enabled)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '409':
      description: The email got an account meanwhile
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
