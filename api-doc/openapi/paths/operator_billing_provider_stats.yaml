get:
  tags:
    - Operator
    - Billing
  summary: Return the payment provider counters of this node. Platform operators only
  description: Webhooks accepted, repeated, unverified (refused for their signature) and failed; reports sent and failed; reconciliation mismatches.
  operationId: OperatorBillingProviderStatsGet
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                additionalProperties:
                  type: integer
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No payment provider on this server (standalone, or [billing] provider "none")
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
