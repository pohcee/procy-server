get:
  tags:
    - Vault
  summary: Get status of Procy vault
  operationId: VaultAdminGet
  description: Returns status information about the Procy vault.
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  init:
                    type: string
                    description: >-
                      vault initialization status: if setup-completed vault is
                      initialized or uninitialized otherwise
                    enum:
                      - setup-completed
                      - uninitialized
                  status:
                    type: string
                    description: vault lock status
                    enum:
                      - locked
                      - unlocked
                  managed:
                    type: boolean
                    description: >-
                      present and true when the vault key comes from a key
                      provider configured in the server instead of a passphrase:
                      the vault needs no initialization and cannot be unlocked or
                      locked through the API
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '500':
      description: Invalid Operation
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
