get:
  tags:
    - Billing
  summary: Return the closed billing periods of the requesting user's organization, newest first. Administrators only
  operationId: BillingPeriodsGet
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/BillingPeriod.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not a member of the Administrators group
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: Billing is off on this server
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
