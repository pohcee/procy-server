get:
  tags:
    - Operator
  summary: Export an organization. Platform operators only
  description: >-
    As GET /organization/export, for any organization.
  operationId: OperatorOrganizationExportGet
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: The export
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/OrganizationExport.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No signup or operator API on this server, the request is not from the system organization, or no such signup or organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
