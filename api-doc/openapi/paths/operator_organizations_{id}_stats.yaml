get:
  tags:
    - Operator
    - Usage
  summary: Return an organization's usage series. Platform operators only
  description: >-
    The report of `GET /operator/organizations/{id}/usage` with every period of the range present (zero-filled), and
    `in`, `out` and `devices` added to each period and to the totals. Without usage metering `{"metering": false,
    "periods": []}`.
  operationId: OperatorOrganizationStatsGet
  parameters:
    - name: id
      in: path
      description: Organization ID
      required: true
      schema:
        type: string
    - name: from
      in: query
      description: Start of the range, an RFC 3339 time or a date (YYYY-MM-DD, UTC). Default the start of the month of `to`
      schema:
        type: string
    - name: to
      in: query
      description: End of the range (excluded), an RFC 3339 time or a date. Default now
      schema:
        type: string
    - name: granularity
      in: query
      description: hour covers at most 31 days, day at most 400
      schema:
        type: string
        enum:
          - hour
          - day
        default: day
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/OperatorStatsReport.yaml
    '400':
      description: Invalid parameters
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No operator API on this server (standalone), the request is not from the system organization, or the organization does not exist
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
