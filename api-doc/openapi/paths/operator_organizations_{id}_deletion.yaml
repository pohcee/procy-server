post:
  tags:
    - Operator
  summary: Start the deletion of an organization. Platform operators only
  description: >-
    As POST /organization/deletion, without the confirmation.
  operationId: OperatorOrganizationDeletionPost
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            reason:
              type: string
              description: Optional
  responses:
    '202':
      description: Pending
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/OrganizationDeletion.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No signup or operator API on this server, the request is not from the system organization, or no such signup or organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '409':
      description: A deletion is pending already
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
delete:
  tags:
    - Operator
  summary: Cancel the deletion of an organization. Platform operators only
  description: >-
    The organization gets back the status it had before the request.
  operationId: OperatorOrganizationDeletionDelete
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Canceled
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/OrganizationDeletion.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No pending deletion, or no such organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
