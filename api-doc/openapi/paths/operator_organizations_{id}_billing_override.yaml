put:
  tags:
    - Operator
  summary: Lift the hard cap or raise the allowance of the current month. Platform operators only
  description: Written to the audit logs of `_system` and of the organization.
  operationId: OperatorOrganizationBillingOverridePut
  parameters:
    - name: id
      in: path
      description: Organization ID
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            cap_lifted_until:
              type: string
              format: date-time
              nullable: true
              description: No hard cap until then; null ends a lift
            extra_transfer:
              type: string
              description: Extra allowance for the current month, for example 50GiB
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/BillingAccount.yaml
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not a platform operator
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No such organization, not the system organization, or billing is off
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
