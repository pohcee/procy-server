get:
  tags:
    - Usage
  summary: Return the usage of the requesting user's organization. Administrators only
  description: >-
    Available on Postgres servers with `[metering] enabled` (capability `usage`). Hourly data is kept 90 days and
    daily data 25 months by default; the range is widened to whole hours, and to whole UTC days for the day and
    month granularities.
  operationId: UsageGet
  parameters:
    - name: from
      in: query
      description: Start of the range, an RFC 3339 time or a date (YYYY-MM-DD, UTC). Default the start of the month of `to`
      schema:
        type: string
    - name: to
      in: query
      description: End of the range (excluded), an RFC 3339 time or a date. Default now
      schema:
        type: string
    - name: granularity
      in: query
      description: Length of the periods. At most 31 days by hour, 400 days by day, 5 years by month
      schema:
        type: string
        enum:
          - hour
          - day
          - month
        default: day
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/UsageReport.yaml
    '400':
      description: Invalid range or granularity
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not a member of the Administrators group
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: Usage metering is off on this server
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
