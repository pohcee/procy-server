put:
  tags:
    - Operator
  summary: Set the device limit of an organization. Platform operators only
  description: Written to the audit log of `_system`.
  operationId: OperatorOrganizationDeviceLimitPut
  parameters:
    - name: id
      in: path
      description: Organization ID
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - device_limit
          properties:
            device_limit:
              type: integer
              nullable: true
              minimum: 0
              description: The most devices the organization may have; null is unlimited
    required: true
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/Organization.yaml
    '400':
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No operator API on this server (standalone), the request is not from the system organization, or the organization does not exist
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
