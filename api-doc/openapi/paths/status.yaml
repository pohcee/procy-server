get:
  tags:
    - Profile & Info
  summary: Get information about Procy server
  operationId: StatusGet
  description: Show health status, server version, etc
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  version:
                    type: string
                  clients_connected:
                    type: integer
                  clients_disconnected:
                    type: integer
                  clients_auth_source:
                    type: string
                    description: The source of clients authentication credentials
                    enum:
                      - Static Credentials
                      - File
                      - DB
                  clients_auth_mode:
                    type: string
                    description: >-
                      Shows whether it's allowed or not to create/update/delete
                      clients authentication credentials
                    enum:
                      - Read Only
                      - Read Write
                  fingerprint:
                    type: string
                  connect_url:
                    type: array
                    description: Full client connect URL(s)
                    items:
                      type: string
                  users_auth_source:
                    type: string
                    description: The source of API users authentication credentials
                    enum:
                      - Static Credentials
                      - File
                      - DB
                  two_fa_enabled:
                    type: boolean
                    description: True if two-factor authentication or totp auth is enabled
                  two_fa_delivery_method:
                    type: string
                    description: >-
                      Delivery method that is used to send auth tokens when 2FA
                      is enabled, if totp is enabled, 'totp_authenticator_app'
                      is returned
                    enum:
                      - email
                      - pushover
                      - totp_authenticator_app
                  tunnel_proxy_enabled:
                    type: boolean
                    description: True if tunnel reverse proxy is enabled
                  used_ports:
                    type: array
                    description: >-
                      Shows a list of port numbers or ranges of server ports,
                      that are used for automatic and manual port assignment
                    items:
                      type: string
                  excluded_ports:
                    type: array
                    description: >-
                      Shows a list of port numbers or ranges of server ports,
                      that are not used for automatic and manual port assignment
                    items:
                      type: string
                  password_min_length:
                    type: integer
                    description: >-
                      Minimal password length required for API user accounts
                  capabilities:
                    type: object
                    description: >-
                      Features this server build offers. A feature is available
                      when its field is true. Clients should treat a missing
                      field (older servers) as available.
                    properties:
                      vault_passphrase:
                        type: boolean
                        description: >-
                          The vault can be initialised and unlocked with a passphrase. False when
                          the vault key comes from a key provider configured in the server.
                      port_tunnels:
                        type: boolean
                        description: Tunnels exposed on a server port
                      http_proxy_tunnels:
                        type: boolean
                        description: HTTP(S) tunnels served through the built-in tunnel reverse proxy
                      subdomain_tunnels:
                        type: boolean
                        description: Tunnels published on their own subdomain via the Caddy integration
                      browser_vnc:
                        type: boolean
                        description: VNC sessions in the browser (noVNC)
                      browser_rdp:
                        type: boolean
                        description: RDP sessions in the browser (guacd)
                      monitoring:
                        type: boolean
                        description: Client monitoring (metrics, processes, mountpoints)
                      alerting:
                        type: boolean
                        description: Alerting rules, templates and problems
                      pairing:
                        type: boolean
                        description: Client installation with a pairing code
                      file_upload:
                        type: boolean
                        description: Uploading files to clients
                      scheduled_jobs:
                        type: boolean
                        description: Scheduled commands and scripts
                      library:
                        type: boolean
                        description: The script and command library
                      operator:
                        type: boolean
                        description: >-
                          The operator API is available to the requesting user (a platform operator on a Postgres
                          server). Present only when true.
                      organizations:
                        type: boolean
                        description: >-
                          A login may belong to several organizations (Postgres servers): `/me/organizations`,
                          `/me/organization`, `/me/invitations` and `/organization/members` exist. Present only when
                          true.
                      usage:
                        type: boolean
                        description: >-
                          Usage metering is on (a Postgres server with `[metering] enabled`): `GET /usage` for
                          administrators and the operator usage routes. Present only when true.
              meta:
                type: object
                properties: {}
    '400':
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '500':
      description: Invalid Operation
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
