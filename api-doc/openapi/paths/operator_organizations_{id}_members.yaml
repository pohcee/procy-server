get:
  tags:
    - Operator
  summary: List the members of an organization. Platform operators only
  description: >-
    The logins that are members of the organization, with their permission groups there and how many organizations
    each belongs to.
  operationId: OperatorOrganizationMembersGet
  parameters:
    - name: id
      in: path
      description: Organization ID
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successful Operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/OrganizationMember.yaml
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '403':
      description: Not an administrator of the system organization
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    '404':
      description: No operator API on this server (standalone), the request is not from the system organization, or the organization does not exist
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
