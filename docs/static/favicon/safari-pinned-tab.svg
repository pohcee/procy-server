<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Procy</title>
  <!-- Single-ink raccoon: head and ears filled, brows, eye whites and muzzle knocked out, mask outlined by a thin gap. -->
  <defs>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <!-- white brows -->
      <path d="M12 31q9-8 17-3" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M52 31q-9-8-17-3" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
      <!-- thin gap that outlines the solid bandit mask -->
      <path d="M8 36q10-10 21-4 3 2 6 0 11-6 21 4-4 10-15 9-6-1-9-5-3 4-9 5-11 1-15-9z" fill="none" stroke="#000" stroke-width="1.6"/>
      <!-- eye whites, pupils restored -->
      <circle cx="22.5" cy="37" r="4" fill="#000"/>
      <circle cx="41.5" cy="37" r="4" fill="#000"/>
      <circle cx="23.3" cy="37.6" r="2" fill="#fff"/>
      <circle cx="42.3" cy="37.6" r="2" fill="#fff"/>
      <!-- muzzle, nose restored -->
      <ellipse cx="32" cy="49" rx="11" ry="7.5" fill="#000"/>
      <ellipse cx="32" cy="45.5" rx="4" ry="3" fill="#fff"/>
    </mask>
  </defs>
  <g fill="#000" mask="url(#cut)">
    <path d="M9 27 13 6l16 11z" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M55 27 51 6 35 17z" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="32" cy="37" rx="25" ry="21"/>
  </g>
</svg>
