<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">How Procy works</title>
  <desc id="d">Admins and users reach the Procy server over HTTPS. Procy clients on private networks connect out to the
    server through their firewall, and tunnels to them ride that existing, encrypted connection.</desc>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-weight: 700; fill: #E6EBF2; }
    .zone { font-size: 13px; font-weight: 600; letter-spacing: 2px; fill: #8E99A8; }
    .tunnel { stroke-dasharray: 2 14; animation: flow 1.2s linear infinite; }
    .led { animation: blink 2.4s ease-in-out infinite; }
    .led.b { animation-delay: .8s; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .tunnel, .led { animation: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#1A222D"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#93B8FF"/>
    </marker>
    <!-- the Procy mark, unchanged, on a 64-unit grid -->
    <g id="mark">
      <path d="M9 27 13 6l16 11z" fill="#6B7280" stroke="#6B7280" stroke-width="3" stroke-linejoin="round"/>
      <path d="M55 27 51 6 35 17z" fill="#6B7280" stroke="#6B7280" stroke-width="3" stroke-linejoin="round"/>
      <path d="M14 22l2-10 8 6z" fill="#1F2937"/>
      <path d="M50 22l-2-10-8 6z" fill="#1F2937"/>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="#9CA3AF"/>
      <path d="M32 18v12" stroke="#4B5563" stroke-width="5" stroke-linecap="round"/>
      <path d="M12 31q9-8 17-3" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M52 31q-9-8-17-3" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M8 36q10-10 21-4 3 2 6 0 11-6 21 4-4 10-15 9-6-1-9-5-3 4-9 5-11 1-15-9z" fill="#1F2937"/>
      <circle cx="22.5" cy="37" r="4" fill="#FFFFFF"/>
      <circle cx="41.5" cy="37" r="4" fill="#FFFFFF"/>
      <circle cx="23.3" cy="37.6" r="2" fill="#111827"/>
      <circle cx="42.3" cy="37.6" r="2" fill="#111827"/>
      <ellipse cx="32" cy="49" rx="11" ry="7.5" fill="#F3F4F6"/>
      <ellipse cx="32" cy="45.5" rx="4" ry="3" fill="#111827"/>
    </g>
  </defs>

  <rect width="1200" height="600" rx="24" fill="url(#sky)"/>
  <g fill="#C2CAD6">
    <circle cx="430" cy="60" r="1.4"/><circle cx="520" cy="112" r="1.1"/><circle cx="700" cy="52" r="1.6"/>
    <circle cx="790" cy="120" r="1.2"/><circle cx="1010" cy="64" r="1.4"/><circle cx="1130" cy="104" r="1.1"/>
  </g>

  <text x="56" y="72" class="h" font-size="30">How Procy works</text>
  <text x="56" y="104" font-size="17" fill="#8E99A8">Clients dial out to your server. You reach them through it.</text>

  <!-- zone labels -->
  <text x="185" y="146" class="zone" text-anchor="middle">YOU</text>
  <text x="600" y="146" class="zone" text-anchor="middle">THE INTERNET</text>
  <text x="1030" y="146" class="zone" text-anchor="middle">PRIVATE NETWORK</text>

  <!-- private network behind its firewall -->
  <rect x="880" y="192" width="290" height="320" rx="18" fill="#121821" stroke="#2E3947" stroke-width="2"/>
  <g>
    <rect x="850" y="214" width="40" height="276" fill="#2E3947"/>
    <g stroke="#1A222D" stroke-width="3">
      <path d="M850 237H890M850 260H890M850 283H890M850 306H890M850 329H890M850 352H890M850 375H890M850 398H890M850 421H890M850 444H890M850 467H890"/>
      <path d="M870 214v23M860 237v23M880 237v23M870 260v23M860 283v23M880 283v23M870 306v23M860 329v23M880 329v23M870 352v23M860 375v23M880 375v23M870 398v23M860 421v23M880 421v23M870 444v23M860 467v23M880 467v23"/>
    </g>
    <path d="M870 178c8 9 14 15 11 23-2 5-6 7-11 7s-9-2-11-7c-2-7 2-11 6-15 0 5 2 7 4 8-1-6-1-11 1-16z" fill="#F5A524"/>
    <path d="M870 193c3 5 5 8 4 11-1 2-2 3-4 3s-4-1-4-3c-1-3 2-6 4-11z" fill="#FEF3C7"/>
  </g>

  <!-- outbound client connections, drawn device to server so the dashes flow toward the server -->
  <g fill="none" stroke-linecap="round">
    <path d="M912 250 C 800 250, 760 290, 676 290" stroke="#1D4ED8" stroke-opacity=".35" stroke-width="12"/>
    <path d="M912 360 C 800 360, 760 318, 676 318" stroke="#1D4ED8" stroke-opacity=".35" stroke-width="12"/>
    <path d="M912 462 C 790 462, 760 346, 676 346" stroke="#1D4ED8" stroke-opacity=".35" stroke-width="12"/>
    <path class="tunnel" d="M912 250 C 800 250, 760 290, 676 290" stroke="#60A5FA" stroke-width="4"/>
    <path class="tunnel" d="M912 360 C 800 360, 760 318, 676 318" stroke="#60A5FA" stroke-width="4"/>
    <path class="tunnel" d="M912 462 C 790 462, 760 346, 676 346" stroke="#60A5FA" stroke-width="4"/>
  </g>
  <text x="764" y="212" font-size="14" fill="#C2CAD6" text-anchor="middle">clients dial out</text>
  <text x="764" y="232" font-size="14" fill="#8E99A8" text-anchor="middle">SSH over HTTP(S)</text>

  <!-- you: a laptop with a terminal and the web UI -->
  <g>
    <rect x="100" y="228" width="170" height="114" rx="8" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
    <rect x="108" y="236" width="154" height="16" rx="4" fill="#2E3947"/>
    <circle cx="117" cy="244" r="3" fill="#8E99A8"/><circle cx="127" cy="244" r="3" fill="#8E99A8"/><circle cx="137" cy="244" r="3" fill="#8E99A8"/>
    <text x="114" y="276" class="mono" font-size="13" fill="#7DB2FF">$ ssh -p 20022</text>
    <rect x="114" y="290" width="128" height="10" rx="3" fill="#2E3947"/><circle cx="252" cy="295" r="3.5" fill="#4ADE80"/>
    <rect x="114" y="306" width="128" height="10" rx="3" fill="#2E3947"/><circle cx="252" cy="311" r="3.5" fill="#4ADE80"/>
    <rect x="114" y="322" width="128" height="10" rx="3" fill="#2E3947"/><circle cx="252" cy="327" r="3.5" fill="#8E99A8"/>
    <path d="M80 344h210l-14 16H94z" fill="#3B4452"/>
  </g>
  <text x="185" y="396" class="h" font-size="19" text-anchor="middle">Admins and users</text>
  <text x="185" y="420" font-size="15" fill="#8E99A8" text-anchor="middle">web UI, API, SSH, RDP</text>

  <!-- you to the server: HTTPS for the API/UI, and a tunnel port -->
  <path d="M300 276H516" stroke="#93B8FF" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="408" y="262" font-size="14" fill="#C2CAD6" text-anchor="middle">HTTPS: API and web UI</text>
  <path d="M300 326H520" fill="none" stroke="#1D4ED8" stroke-opacity=".35" stroke-width="12" stroke-linecap="round"/>
  <path class="tunnel" d="M300 326H520" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
  <text x="408" y="360" font-size="14" fill="#C2CAD6" text-anchor="middle">a tunnel port, e.g. :20022</text>

  <!-- the Procy server -->
  <use href="#mark" transform="translate(560 158) scale(1.25)"/>
  <g>
    <rect x="525" y="236" width="150" height="148" rx="12" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
    <rect x="539" y="252" width="122" height="30" rx="6" fill="#121821"/>
    <rect x="539" y="294" width="122" height="30" rx="6" fill="#121821"/>
    <rect x="539" y="336" width="122" height="30" rx="6" fill="#121821"/>
    <path d="M553 267h52M553 309h52M553 351h52" stroke="#3B4452" stroke-width="5" stroke-linecap="round"/>
    <circle class="led" cx="645" cy="267" r="5" fill="#4ADE80"/>
    <circle class="led b" cx="645" cy="309" r="5" fill="#4ADE80"/>
    <circle class="led" cx="645" cy="351" r="5" fill="#4ADE80"/>
  </g>
  <text x="600" y="420" class="h" font-size="19" text-anchor="middle">Procy server</text>
  <text x="600" y="444" class="mono" font-size="15" fill="#8E99A8" text-anchor="middle">rportd</text>

  <!-- clients -->
  <g>
    <rect x="912" y="222" width="60" height="56" rx="8" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
    <rect x="920" y="232" width="44" height="14" rx="3" fill="#121821"/>
    <rect x="920" y="254" width="44" height="14" rx="3" fill="#121821"/>
    <circle class="led" cx="956" cy="239" r="3" fill="#4ADE80"/><circle class="led b" cx="956" cy="261" r="3" fill="#4ADE80"/>
    <text x="988" y="246" font-size="16" fill="#E6EBF2">Linux server</text>
    <text x="988" y="266" class="mono" font-size="13" fill="#8E99A8">rport</text>
  </g>
  <g>
    <rect x="912" y="334" width="60" height="42" rx="5" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
    <rect x="920" y="342" width="44" height="26" rx="2" fill="#2563EB" fill-opacity=".55"/>
    <path d="M934 378v8M950 378v8M926 388h32" stroke="#3B4452" stroke-width="4" stroke-linecap="round"/>
    <text x="988" y="356" font-size="16" fill="#E6EBF2">Windows PC</text>
    <text x="988" y="376" class="mono" font-size="13" fill="#8E99A8">rport.exe</text>
  </g>
  <g>
    <path d="M926 448l-8-18M958 448l8-18" stroke="#3B4452" stroke-width="4" stroke-linecap="round"/>
    <rect x="912" y="446" width="60" height="30" rx="7" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
    <circle class="led" cx="926" cy="461" r="3" fill="#4ADE80"/><circle cx="938" cy="461" r="3" fill="#4ADE80"/><circle class="led b" cx="950" cy="461" r="3" fill="#F5A524"/>
    <text x="988" y="458" font-size="16" fill="#E6EBF2">Router, NAS, IoT</text>
    <text x="988" y="478" font-size="13" fill="#8E99A8">via a nearby client</text>
  </g>

  <text x="600" y="564" font-size="16" fill="#C2CAD6" text-anchor="middle">Nothing on the private network accepts incoming connections. Tunnels ride the connection each client already holds.</text>
</svg>
