<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="t d">
  <title id="t">Running commands on clients</title>
  <desc id="d">You send a command to the Procy server through the API, for one client or many. The server passes it to
    each client over the connection the client already holds, no tunnel needed. Each client checks it against its
    own allow and deny rules, runs it and sends back stdout, stderr and the status, which you fetch by job id.</desc>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-weight: 700; fill: #E6EBF2; }
    .link { fill: none; stroke: #93B8FF; stroke-width: 3; }
    .back { fill: none; stroke: #4ADE80; stroke-width: 2.5; stroke-dasharray: 7 6; }
    .led { animation: blink 2.4s ease-in-out infinite; }
    .led.b { animation-delay: .8s; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .led { animation: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#1A222D"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#93B8FF"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4ADE80"/>
    </marker>
    <g id="mark">
      <path d="M9 27 13 6l16 11z" fill="#6B7280" stroke="#6B7280" stroke-width="3" stroke-linejoin="round"/>
      <path d="M55 27 51 6 35 17z" fill="#6B7280" stroke="#6B7280" stroke-width="3" stroke-linejoin="round"/>
      <path d="M14 22l2-10 8 6z" fill="#1F2937"/>
      <path d="M50 22l-2-10-8 6z" fill="#1F2937"/>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="#9CA3AF"/>
      <path d="M32 18v12" stroke="#4B5563" stroke-width="5" stroke-linecap="round"/>
      <path d="M12 31q9-8 17-3" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M52 31q-9-8-17-3" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M8 36q10-10 21-4 3 2 6 0 11-6 21 4-4 10-15 9-6-1-9-5-3 4-9 5-11 1-15-9z" fill="#1F2937"/>
      <circle cx="22.5" cy="37" r="4" fill="#FFFFFF"/>
      <circle cx="41.5" cy="37" r="4" fill="#FFFFFF"/>
      <circle cx="23.3" cy="37.6" r="2" fill="#111827"/>
      <circle cx="42.3" cy="37.6" r="2" fill="#111827"/>
      <ellipse cx="32" cy="49" rx="11" ry="7.5" fill="#F3F4F6"/>
      <ellipse cx="32" cy="45.5" rx="4" ry="3" fill="#111827"/>
    </g>
    <g id="client">
      <rect width="64" height="56" rx="8" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
      <rect x="8" y="10" width="48" height="14" rx="3" fill="#121821"/>
      <rect x="8" y="32" width="48" height="14" rx="3" fill="#121821"/>
    </g>
  </defs>

  <rect width="1200" height="530" rx="24" fill="url(#sky)"/>

  <text x="56" y="72" class="h" font-size="30">Running commands</text>
  <text x="56" y="104" font-size="17" fill="#8E99A8">No tunnel needed: commands travel over the connection each client already holds.</text>

  <!-- you: the request -->
  <g transform="translate(56 170)">
    <rect width="300" height="170" rx="10" fill="#0B0F14" stroke="#3B4452" stroke-width="2"/>
    <rect x="8" y="8" width="284" height="14" rx="4" fill="#2E3947"/>
    <circle cx="17" cy="15" r="2.5" fill="#8E99A8"/><circle cx="26" cy="15" r="2.5" fill="#8E99A8"/><circle cx="35" cy="15" r="2.5" fill="#8E99A8"/>
    <text x="16" y="50" class="mono" font-size="14" fill="#7DB2FF">POST /api/v1/commands</text>
    <text x="16" y="76" class="mono" font-size="14" fill="#C2CAD6">{</text>
    <text x="16" y="98" class="mono" font-size="14" fill="#C2CAD6">&#160;&#160;"command": "/bin/date",</text>
    <text x="16" y="120" class="mono" font-size="14" fill="#C2CAD6">&#160;&#160;"group_ids": ["web"]</text>
    <text x="16" y="142" class="mono" font-size="14" fill="#C2CAD6">}</text>
  </g>
  <text x="206" y="378" class="h" font-size="18" text-anchor="middle">You</text>
  <text x="206" y="402" font-size="14" fill="#8E99A8" text-anchor="middle">API, web UI or websocket</text>

  <!-- to the server -->
  <path class="link" d="M360 236H502" marker-end="url(#arrow)"/>
  <text x="431" y="222" font-size="14" fill="#C2CAD6" text-anchor="middle">job id</text>
  <path class="back" d="M502 290H364" marker-end="url(#arrow-green)"/>
  <text x="433" y="316" font-size="14" fill="#C2CAD6" text-anchor="middle">results</text>

  <!-- the server -->
  <use href="#mark" transform="translate(546 132) scale(.85)"/>
  <g>
    <rect x="508" y="182" width="120" height="132" rx="12" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
    <rect x="520" y="196" width="96" height="28" rx="6" fill="#121821"/>
    <rect x="520" y="234" width="96" height="28" rx="6" fill="#121821"/>
    <rect x="520" y="272" width="96" height="28" rx="6" fill="#121821"/>
    <circle class="led" cx="602" cy="210" r="4" fill="#4ADE80"/>
    <circle class="led b" cx="602" cy="248" r="4" fill="#4ADE80"/>
    <circle class="led" cx="602" cy="286" r="4" fill="#4ADE80"/>
  </g>
  <text x="568" y="350" class="h" font-size="18" text-anchor="middle">Procy server</text>
  <text x="568" y="374" font-size="14" fill="#8E99A8" text-anchor="middle">one job per client</text>

  <!-- fan out to the clients -->
  <path class="link" d="M628 220C700 220 700 168 790 168" marker-end="url(#arrow)"/>
  <path class="link" d="M628 248H790" marker-end="url(#arrow)"/>
  <path class="link" d="M628 276C700 276 700 328 790 328" marker-end="url(#arrow)"/>

  <g>
    <use href="#client" x="796" y="140"/>
    <circle class="led" cx="844" cy="157" r="3" fill="#4ADE80"/><circle cx="844" cy="179" r="3" fill="#4ADE80"/>
    <text x="876" y="160" class="mono" font-size="14" fill="#E6EBF2">web-01</text>
    <text x="876" y="182" class="mono" font-size="13" fill="#4ADE80">successful</text>
  </g>
  <g>
    <use href="#client" x="796" y="220"/>
    <circle cx="844" cy="237" r="3" fill="#4ADE80"/><circle class="led b" cx="844" cy="259" r="3" fill="#4ADE80"/>
    <text x="876" y="240" class="mono" font-size="14" fill="#E6EBF2">web-02</text>
    <text x="876" y="262" class="mono" font-size="13" fill="#4ADE80">successful</text>
  </g>
  <g>
    <use href="#client" x="796" y="300"/>
    <circle cx="844" cy="317" r="3" fill="#4ADE80"/><circle cx="844" cy="339" r="3" fill="#F5A524"/>
    <text x="876" y="320" class="mono" font-size="14" fill="#E6EBF2">web-03</text>
    <text x="876" y="342" class="mono" font-size="13" fill="#F5A524">running</text>
  </g>

  <!-- the client's own rules -->
  <rect x="996" y="140" width="164" height="216" rx="14" fill="#121821" stroke="#2E3947" stroke-width="2"/>
  <text x="1016" y="170" font-size="14" font-weight="700" fill="#E6EBF2">rport.conf</text>
  <text x="1016" y="196" class="mono" font-size="13" fill="#8E99A8">[remote-commands]</text>
  <text x="1016" y="220" class="mono" font-size="13" fill="#4ADE80">allow ^/bin/.*</text>
  <text x="1016" y="242" class="mono" font-size="13" fill="#F87171">deny  ; | &gt; &lt;</text>
  <text x="1016" y="276" font-size="13" fill="#C2CAD6">Each client checks</text>
  <text x="1016" y="296" font-size="13" fill="#C2CAD6">the command against</text>
  <text x="1016" y="316" font-size="13" fill="#C2CAD6">its own rules before</text>
  <text x="1016" y="336" font-size="13" fill="#C2CAD6">it runs anything.</text>

  <text x="600" y="460" font-size="16" fill="#C2CAD6" text-anchor="middle">Fetch each result by job id: status, stdout and stderr.</text>
  <text x="600" y="488" font-size="16" fill="#8E99A8" text-anchor="middle">Commands run under the account of the rport client. On Linux that is an unprivileged user by default.</text>
</svg>
