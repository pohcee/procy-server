<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">How an on-demand tunnel works</title>
  <desc id="d">1. The client connects out to the Procy server and waits without a tunnel. 2. You request a tunnel through
    the API or web UI. 3. The server opens a port, for example 20022, and tells the client over its existing
    connection. 4. You connect to that port and come out on port 22 of the client.</desc>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-weight: 700; fill: #E6EBF2; }
    .n { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .tunnel { stroke-dasharray: 2 14; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .tunnel { animation: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#1A222D"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#93B8FF"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8E99A8"/>
    </marker>
    <g id="mark">
      <path d="M9 27 13 6l16 11z" fill="#6B7280" stroke="#6B7280" stroke-width="3" stroke-linejoin="round"/>
      <path d="M55 27 51 6 35 17z" fill="#6B7280" stroke="#6B7280" stroke-width="3" stroke-linejoin="round"/>
      <path d="M14 22l2-10 8 6z" fill="#1F2937"/>
      <path d="M50 22l-2-10-8 6z" fill="#1F2937"/>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="#9CA3AF"/>
      <path d="M32 18v12" stroke="#4B5563" stroke-width="5" stroke-linecap="round"/>
      <path d="M12 31q9-8 17-3" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M52 31q-9-8-17-3" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M8 36q10-10 21-4 3 2 6 0 11-6 21 4-4 10-15 9-6-1-9-5-3 4-9 5-11 1-15-9z" fill="#1F2937"/>
      <circle cx="22.5" cy="37" r="4" fill="#FFFFFF"/>
      <circle cx="41.5" cy="37" r="4" fill="#FFFFFF"/>
      <circle cx="23.3" cy="37.6" r="2" fill="#111827"/>
      <circle cx="42.3" cy="37.6" r="2" fill="#111827"/>
      <ellipse cx="32" cy="49" rx="11" ry="7.5" fill="#F3F4F6"/>
      <ellipse cx="32" cy="45.5" rx="4" ry="3" fill="#111827"/>
    </g>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#sky)"/>

  <text x="56" y="72" class="h" font-size="30">On-demand tunnels</text>
  <text x="56" y="104" font-size="17" fill="#8E99A8">Clients wait without a tunnel. You open one only when you need it.</text>

  <!-- actors -->
  <g>
    <rect x="160" y="158" width="100" height="64" rx="6" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
    <text x="172" y="196" class="mono" font-size="14" fill="#7DB2FF">$ _</text>
    <path d="M146 224h128l-10 12H156z" fill="#3B4452"/>
    <text x="210" y="266" class="h" font-size="18" text-anchor="middle">You</text>
  </g>
  <g>
    <use href="#mark" transform="translate(574 128) scale(.8)"/>
    <rect x="548" y="174" width="104" height="62" rx="10" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
    <rect x="558" y="184" width="84" height="18" rx="4" fill="#121821"/>
    <rect x="558" y="208" width="84" height="18" rx="4" fill="#121821"/>
    <circle cx="630" cy="193" r="3.5" fill="#4ADE80"/><circle cx="630" cy="217" r="3.5" fill="#4ADE80"/>
    <text x="600" y="266" class="h" font-size="18" text-anchor="middle">Procy server</text>
  </g>
  <g>
    <rect x="958" y="174" width="84" height="62" rx="10" fill="#1A222D" stroke="#3B4452" stroke-width="2"/>
    <rect x="968" y="184" width="64" height="18" rx="4" fill="#121821"/>
    <rect x="968" y="208" width="64" height="18" rx="4" fill="#121821"/>
    <circle cx="1020" cy="193" r="3.5" fill="#4ADE80"/><circle cx="1020" cy="217" r="3.5" fill="#4ADE80"/>
    <text x="1000" y="266" class="h" font-size="18" text-anchor="middle">Client</text>
  </g>

  <!-- lifelines -->
  <path d="M210 284V556M600 284V556M1000 284V556" stroke="#2E3947" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- the client's firewall -->
  <g>
    <rect x="896" y="284" width="28" height="272" fill="#2E3947"/>
    <g stroke="#1A222D" stroke-width="3">
      <path d="M896 307H924M896 330H924M896 353H924M896 376H924M896 399H924M896 422H924M896 445H924M896 468H924M896 491H924M896 514H924M896 537H924"/>
      <path d="M910 284v23M910 330v23M910 376v23M910 422v23M910 468v23M910 514v23"/>
    </g>
    <text x="910" y="578" font-size="13" fill="#8E99A8" text-anchor="middle">firewall</text>
  </g>

  <!-- 1: the client connects out and waits -->
  <circle cx="64" cy="320" r="14" fill="#2563EB"/><text x="64" y="325" class="n" text-anchor="middle">1</text>
  <path d="M996 320H608" stroke="#8E99A8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-grey)"/>
  <text x="750" y="306" font-size="15" fill="#C2CAD6" text-anchor="middle">connects out, then waits</text>

  <!-- 2: you ask for a tunnel -->
  <circle cx="64" cy="390" r="14" fill="#2563EB"/><text x="64" y="395" class="n" text-anchor="middle">2</text>
  <path d="M214 390H592" stroke="#93B8FF" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="405" y="376" class="mono" font-size="14" fill="#E6EBF2" text-anchor="middle">PUT /clients/{id}/tunnels?remote=22</text>
  <text x="405" y="412" font-size="13" fill="#8E99A8" text-anchor="middle">API or web UI</text>

  <!-- 3: the server opens a port and tells the client -->
  <circle cx="64" cy="460" r="14" fill="#2563EB"/><text x="64" y="465" class="n" text-anchor="middle">3</text>
  <rect x="534" y="444" width="132" height="32" rx="16" fill="#121821" stroke="#2563EB" stroke-width="2"/>
  <text x="600" y="465" class="mono" font-size="14" fill="#93B8FF" text-anchor="middle">:20022 open</text>
  <path d="M670 460H992" stroke="#93B8FF" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="780" y="446" font-size="15" fill="#C2CAD6" text-anchor="middle">over the same connection</text>

  <!-- 4: you connect through the tunnel -->
  <circle cx="64" cy="530" r="14" fill="#2563EB"/><text x="64" y="535" class="n" text-anchor="middle">4</text>
  <path d="M214 530H996" fill="none" stroke="#1D4ED8" stroke-opacity=".35" stroke-width="14" stroke-linecap="round"/>
  <path class="tunnel" d="M214 530H996" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
  <text x="405" y="512" class="mono" font-size="14" fill="#E6EBF2" text-anchor="middle">ssh -p 20022 procy.example.com</text>
  <rect x="1010" y="514" width="104" height="32" rx="16" fill="#121821" stroke="#4ADE80" stroke-width="2"/>
  <text x="1062" y="535" class="mono" font-size="14" fill="#4ADE80" text-anchor="middle">sshd :22</text>

  <text x="600" y="612" font-size="15" fill="#C2CAD6" text-anchor="middle">The tunnel closes when you delete it or after its idle timeout. Use an ACL to limit who can reach the port.</text>
</svg>
