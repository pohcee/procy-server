version: "2"

run:
  # exit code when at least one issue was found, default is 1
  issues-exit-code: 1
  # include test files or not, default is true
  tests: true

linters:
  default: none
  enable:
    - govet
    - revive
    - staticcheck # includes the former gosimple and stylecheck
    - errcheck
    - unused
    - gosec
    - gocyclo
    - misspell
    - unparam
    - ineffassign
    - unconvert

  settings:
    errcheck:
      # report about not checking of errors in type assertions: `a := b.(MyStruct)`
      check-type-assertions: false
      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`
      check-blank: false
    govet:
      enable:
        # report about shadowed variables
        - shadow
    staticcheck:
      # same scope as v1's staticcheck + gosimple; stylecheck (ST) was never
      # enabled and the quickfix (QF) suggestions did not exist in v1
      checks:
        - all
        - -ST*
        - -QF*
    gocyclo:
      # TODO: reduce to 20 when complex code would be refactored
      min-complexity: 40
    misspell:
      locale: US
    unparam:
      # Inspect exported functions, default is false.
      check-exported: false

  exclusions:
    generated: lax
    # the exclusions golangci-lint v1 applied by default
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # gosec
      - text: 'G401: Use of weak cryptographic primitive'
        linters: [gosec]
      - text: 'G404: Use of weak random number generator'
        linters: [gosec]
      - text: 'G501: Blocklisted import crypto/md5: weak cryptographic primitive'
        linters: [gosec]
      - text: 'G505: Blocklisted import crypto/sha1: weak cryptographic primitive'
        linters: [gosec]
      - text: 'G204: Subprocess launched with'
        linters: [gosec]
      # test fixtures are full of fake credentials
      - text: 'G101: Potential hardcoded credentials|G117: Marshaled struct field'
        path: _test\.go
        linters: [gosec]
      # test fixture helpers take parameters that read well at the call site,
      # even when every current caller passes the same value
      - text: 'always receives'
        path: _test\.go
        linters: [unparam]
      # govet
      - text: 'shadow: declaration of .err. shadows declaration'
        linters: [govet]
      - text: 'shadow: declaration of "c." shadows declaration'
        linters: [govet]
      # staticcheck
      - text: 'SA1019' # x is deprecated
        linters: [staticcheck]

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pohcee/procy-server
