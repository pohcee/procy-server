name: Test Client Windows
on: [push]
jobs:
  test:
    name: Test Client Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -v ./client/...
      - name: BDD
        run: go test -race -v ./bdd/...

# trigger workflow registration
