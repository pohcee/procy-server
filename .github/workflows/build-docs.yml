name: Build and deploy docs
# Publishes https://docs.procy.sh (Hugo site in docs/) with the API reference at /api/.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'api-doc/**'
      - 'README.md'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  docs:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown Lint
        run: |
          cd docs
          npx markdownlint-cli content/

      - name: Build the API reference
        run: npx @redocly/cli build-docs api-doc/openapi/openapi.yaml -o docs/static/api/index.html

      - name: Build with Hugo
        run: |
          curl -sL https://github.com/gohugoio/hugo/releases/download/v0.101.0/hugo_0.101.0_Linux-64bit.tar.gz|tar xzf - hugo
          mv hugo ~/
          cd docs
          ~/hugo --minify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
