name: Build docs
# Builds the docs site served at https://procy.sh/docs/ (Hugo site in docs/, API reference at
# /docs/api/). The site is uploaded as the "procy-docs" artifact. To publish it, unpack it into a
# folder on the Procy server and link that folder as <doc_root>/docs.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'api-doc/**'
      - 'README.md'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown Lint
        run: |
          cd docs
          npx markdownlint-cli content/

      - name: Build the API reference
        run: npx @redocly/cli build-docs api-doc/openapi/openapi.yaml -o docs/static/api/index.html

      - name: Build with Hugo
        run: |
          curl -sL https://github.com/gohugoio/hugo/releases/download/v0.101.0/hugo_0.101.0_Linux-64bit.tar.gz|tar xzf - hugo
          mv hugo ~/
          cd docs
          ~/hugo --minify

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: procy-docs
          path: docs/public
          retention-days: 30
