name: Lint
on: [push]
jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        shell: bash
        env:
          # v1.x can't read the export data of Go >= 1.22 and panics
          GOLANGCI_LINT_VERSION: 2.15.0
        run: |
          mkdir -p ~/bin
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C /tmp
          mv "/tmp/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" ~/bin
          ~/bin/golangci-lint version
          ~/bin/golangci-lint run
