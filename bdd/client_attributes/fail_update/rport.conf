[client]
  server = "127.0.0.1:9013"

  auth = "bddClient:bdd-client-password"

  use_system_id = true
  use_hostname = true
  tags = ['task-vm', 'vm']
  data_dir = "./rc-test-resources"

[monitoring]
  enabled = true
  pm_enabled = true
