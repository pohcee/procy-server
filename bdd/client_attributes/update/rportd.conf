[server]
  key_seed = "bdd-test-key-seed"
  address = "0.0.0.0:9011"

  auth = "bddClient:bdd-client-password"

  data_dir = "./rd-test-resources"


[logging]
  log_level = "info"

[api]
  address = "0.0.0.0:4011"

  auth = "admin:bdd-admin-password"

  jwt_secret = "bdd-test-jwt-secret-0123456789abcdef"

